<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de solicitudes de periféricos</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <h1>🖱️ Control de solicitudes de periféricos</h1>
  <div class="grid">
    <div>
      <div class="card">
        <h2>Nueva solicitud</h2>
        <label for="user">Usuario (nombre o correo)</label>
        <input id="user" list="users" autocomplete="off" placeholder="Ej: Juan Pérez">
        <datalist id="users"></datalist>
        <label for="area">Área / departamento</label>
        <input id="area" placeholder="Ej: Contabilidad">
        <label for="item">Artículo</label>
        <select id="item">
          <option>Teclado</option><option>Mouse</option><option>Audífonos</option>
          <option>Webcam</option><option>Mousepad</option><option>Monitor</option><option>Otro</option>
        </select>
        <label for="reason">Motivo</label>
        <select id="reason">
          <option>Nuevo ingreso</option><option>Falla / daño</option><option>Pérdida</option><option>Reemplazo por desgaste</option><option>Otro</option>
        </select>
        <label for="note">Observación (opcional)</label>
        <textarea id="note" rows="2"></textarea>
        <div id="live" class="alert"></div>
        <button class="primary" id="save">Registrar entrega</button>
      </div>
      <div class="card" style="margin-top:14px">
        <h2>Conexión con Google Sheets</h2>
        <label for="cu">URL de la aplicación web (Apps Script)</label>
        <input id="cu" placeholder="https://script.google.com/macros/s/.../exec">
        <label for="ck">Clave de acceso</label>
        <input id="ck" type="password" autocomplete="off">
        <button class="primary" id="cs" style="margin-top:10px">Guardar y sincronizar</button>
        <p class="small" id="status"></p>
      </div>
      <div class="card" style="margin-top:14px">
        <h2>Reglas de alerta</h2>
        <div class="cfg">
          <div><label for="limit">Máx. solicitudes</label><input id="limit" type="number" min="1" value="2"></div>
          <div><label for="months">Ventana (meses)</label><input id="months" type="number" min="1" value="12"></div>
        </div>
        <p class="small">Se alerta cuando el usuario alcanza o supera el máximo dentro de la ventana.</p>
        <div class="row">
          <button id="csv">Exportar CSV</button>
          <button id="bk">Respaldo</button>
          <button id="rs">Restaurar</button>
          <input id="file" type="file" accept=".json" hidden>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="tabs">
        <button id="t1" class="on">Resumen por usuario</button>
        <button id="t2">Historial</button>
      </div>
      <input id="q" placeholder="Buscar usuario…" style="margin-bottom:10px">
      <div class="scroll" id="view"></div>
    </div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
