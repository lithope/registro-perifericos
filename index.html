<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Control de solicitudes de periféricos</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
--bg:#f5f6f8;--card:#fff;--text:#1c2030;--muted:#6b7285;--line:#e1e4ea;--accent:#2f5bea;--accent-t:#fff;
--ok:#1f8a4c;--okbg:#e4f5ea;--warn:#b26a00;--warnbg:#fff1d6;--bad:#c0262d;--badbg:#fde6e7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14161c;--card:#1d2029;--text:#e8eaf0;--muted:#9aa1b5;--line:#2e3340;--accent:#6b8cff;--accent-t:#0e1220;--ok:#5fd08a;--okbg:#17301f;--warn:#f0b24a;--warnbg:#37290f;--bad:#ff7b82;--badbg:#3a1a1d}}
:root[data-theme="dark"]{--bg:#14161c;--card:#1d2029;--text:#e8eaf0;--muted:#9aa1b5;--line:#2e3340;--accent:#6b8cff;--accent-t:#0e1220;--ok:#5fd08a;--okbg:#17301f;--warn:#f0b24a;--warnbg:#37290f;--bad:#ff7b82;--badbg:#3a1a1d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.wrap{max-width:980px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:4px 0 14px}
h2{font-size:15px;margin:0 0 10px}
.grid{display:grid;gap:14px;grid-template-columns:1fr}
@media(min-width:760px){.grid{grid-template-columns:360px 1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,select,textarea,button{font:inherit;color:inherit}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);padding:8px 12px;border-radius:8px}
button.primary{background:var(--accent);color:var(--accent-t);border-color:var(--accent);width:100%;margin-top:14px;padding:10px;font-weight:600}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.alert{margin-top:12px;padding:10px 12px;border-radius:8px;font-size:14px;display:none}
.alert.ok{display:block;background:var(--okbg);color:var(--ok)}
.alert.warn{display:block;background:var(--warnbg);color:var(--warn)}
.alert.bad{display:block;background:var(--badbg);color:var(--bad)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--muted);font-weight:600;font-size:12px}
.badge{display:inline-block;padding:2px 8px;border-radius:99px;font-size:12px;font-weight:600}
.badge.ok{background:var(--okbg);color:var(--ok)}.badge.warn{background:var(--warnbg);color:var(--warn)}.badge.bad{background:var(--badbg);color:var(--bad)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tabs button.on{background:var(--accent);color:var(--accent-t);border-color:var(--accent)}
.small{font-size:12px;color:var(--muted)}
.x{border:none;background:none;color:var(--bad);padding:2px 6px}
.cfg{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}.cfg>div{flex:1;min-width:120px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🖱️ Control de solicitudes de periféricos</h1>
  <div class="grid">
    <div>
      <div class="card">
        <h2>Nueva solicitud</h2>
        <label for="user">Usuario (nombre o correo)</label>
        <input id="user" list="users" autocomplete="off" placeholder="Ej: Juan Pérez">
        <datalist id="users"></datalist>
        <label for="area">Área / departamento</label>
        <input id="area" placeholder="Ej: Contabilidad">
        <label for="item">Artículo</label>
        <select id="item">
          <option>Teclado</option><option>Mouse</option><option>Audífonos</option>
          <option>Webcam</option><option>Mousepad</option><option>Monitor</option><option>Otro</option>
        </select>
        <label for="reason">Motivo</label>
        <select id="reason">
          <option>Nuevo ingreso</option><option>Falla / daño</option><option>Pérdida</option><option>Reemplazo por desgaste</option><option>Otro</option>
        </select>
        <label for="note">Observación (opcional)</label>
        <textarea id="note" rows="2"></textarea>
        <div id="live" class="alert"></div>
        <button class="primary" id="save">Registrar entrega</button>
      </div>
      <div class="card" style="margin-top:14px">
        <h2>Reglas de alerta</h2>
        <div class="cfg">
          <div><label for="limit">Máx. solicitudes</label><input id="limit" type="number" min="1" value="2"></div>
          <div><label for="months">Ventana (meses)</label><input id="months" type="number" min="1" value="12"></div>
        </div>
        <p class="small">Se alerta cuando el usuario alcanza o supera el máximo dentro de la ventana.</p>
        <div class="row">
          <button id="csv">Exportar CSV</button>
          <button id="bk">Respaldo</button>
          <button id="rs">Restaurar</button>
          <input id="file" type="file" accept=".json" hidden>
        </div>
      </div>
    </div>
    <div class="card">
      <div class="tabs">
        <button id="t1" class="on">Resumen por usuario</button>
        <button id="t2">Historial</button>
      </div>
      <input id="q" placeholder="Buscar usuario…" style="margin-bottom:10px">
      <div class="scroll" id="view"></div>
    </div>
  </div>
</div>
<script>
var KEY = "perifericos_v1";
var db = { reqs: [], limit: 2, months: 12 };
var tab = 1;
var $ = function (id) { return document.getElementById(id); };

function load() {
  try { var r = localStorage.getItem(KEY); if (r) db = JSON.parse(r); } catch (e) {}
  $("limit").value = db.limit; $("months").value = db.months;
}
function save() { try { localStorage.setItem(KEY, JSON.stringify(db)); } catch (e) {} }
function norm(s) { return s.trim().toLowerCase(); }
function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
function cutoff() { var d = new Date(); d.setMonth(d.getMonth() - db.months); return d.getTime(); }
function stats(name) {
  var c = cutoff(), n = norm(name), tot = 0, by = {}, all = 0;
  db.reqs.forEach(function (r) {
    if (norm(r.user) !== n) return;
    all++;
    if (r.ts >= c) { tot++; by[r.item] = (by[r.item] || 0) + 1; }
  });
  return { tot: tot, by: by, all: all };
}
function level(n) { return n >= db.limit + 1 ? "bad" : n >= db.limit ? "warn" : "ok"; }
function detail(by) { return Object.keys(by).map(function (k) { return k + ": " + by[k]; }).join(", "); }

function liveCheck() {
  var box = $("live"), name = $("user").value;
  if (!norm(name)) { box.className = "alert"; return; }
  var s = stats(name);
  if (!s.all) { box.className = "alert ok"; box.textContent = "Primera solicitud de este usuario."; return; }
  var lv = level(s.tot);
  box.className = "alert " + (lv === "ok" ? "ok" : lv);
  box.textContent = (lv === "ok" ? "" : "⚠️ ") + name.trim() + " lleva " + s.tot + " solicitud(es) en los últimos " + db.months + " meses" + (s.tot ? " (" + detail(s.by) + ")" : "") + (lv === "ok" ? "." : ". Revisa antes de entregar.");
}

function render() {
  var q = norm($("q").value), html = "";
  var dl = {};
  db.reqs.forEach(function (r) { dl[r.user] = 1; });
  $("users").innerHTML = Object.keys(dl).map(function (u) { return "<option value=\"" + esc(u) + "\">"; }).join("");
  if (tab === 1) {
    var map = {};
    db.reqs.forEach(function (r) { var k = norm(r.user); (map[k] = map[k] || { name: r.user, area: r.area }).area = r.area || map[k].area; });
    var rows = Object.keys(map).filter(function (k) { return !q || k.indexOf(q) >= 0; }).map(function (k) {
      var s = stats(map[k].name); return { n: map[k].name, a: map[k].area, s: s };
    }).sort(function (a, b) { return b.s.tot - a.s.tot; });
    html = "<table><tr><th>Usuario</th><th>Área</th><th>En ventana</th><th>Total histórico</th><th>Detalle</th></tr>" +
      (rows.map(function (r) {
        return "<tr><td>" + esc(r.n) + "</td><td>" + esc(r.a || "-") + "</td><td><span class=\"badge " + level(r.s.tot) + "\">" + r.s.tot + "</span></td><td>" + r.s.all + "</td><td class=\"small\">" + esc(detail(r.s.by)) + "</td></tr>";
      }).join("") || "<tr><td colspan=5 class=\"small\">Sin registros todavía.</td></tr>") + "</table>";
  } else {
    var list = db.reqs.slice().reverse().filter(function (r) { return !q || norm(r.user).indexOf(q) >= 0; });
    html = "<table><tr><th>Fecha</th><th>Usuario</th><th>Artículo</th><th>Motivo</th><th>Obs.</th><th></th></tr>" +
      (list.map(function (r) {
        return "<tr><td>" + new Date(r.ts).toLocaleDateString("es-CL") + "</td><td>" + esc(r.user) + "</td><td>" + esc(r.item) + "</td><td>" + esc(r.reason) + "</td><td class=\"small\">" + esc(r.note || "") + "</td><td><button class=\"x\" data-id=\"" + r.id + "\" title=\"Eliminar\">✕</button></td></tr>";
      }).join("") || "<tr><td colspan=6 class=\"small\">Sin registros todavía.</td></tr>") + "</table>";
  }
  $("view").innerHTML = html;
  $("t1").className = tab === 1 ? "on" : ""; $("t2").className = tab === 2 ? "on" : "";
}

$("save").onclick = function () {
  var name = $("user").value.trim();
  if (!name) { $("user").focus(); return; }
  var s = stats(name);
  if (s.tot >= db.limit) {
    if (!confirm(name + " ya tiene " + s.tot + " solicitud(es) en los últimos " + db.months + " meses (" + detail(s.by) + ").\n¿Registrar la entrega de todos modos?")) return;
  }
  db.reqs.push({ id: Date.now() + "" + Math.floor(Math.random() * 1000), ts: Date.now(), user: name, area: $("area").value.trim(), item: $("item").value, reason: $("reason").value, note: $("note").value.trim() });
  save(); $("note").value = ""; liveCheck(); render();
};
$("user").oninput = function () {
  var k = norm(this.value), f = db.reqs.filter(function (r) { return norm(r.user) === k; }).pop();
  if (f && !$("area").value) $("area").value = f.area || "";
  liveCheck();
};
$("limit").onchange = $("months").onchange = function () {
  db.limit = Math.max(1, +$("limit").value || 2); db.months = Math.max(1, +$("months").value || 12);
  save(); liveCheck(); render();
};
$("q").oninput = render;
$("t1").onclick = function () { tab = 1; render(); };
$("t2").onclick = function () { tab = 2; render(); };
$("view").onclick = function (e) {
  var id = e.target.getAttribute && e.target.getAttribute("data-id");
  if (id && confirm("¿Eliminar este registro?")) { db.reqs = db.reqs.filter(function (r) { return r.id !== id; }); save(); liveCheck(); render(); }
};
function dl(name, text, type) {
  var a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type: type })); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
$("csv").onclick = function () {
  var h = "fecha,usuario,area,articulo,motivo,observacion\n";
  var b = db.reqs.map(function (r) {
    return [new Date(r.ts).toISOString().slice(0, 10), r.user, r.area, r.item, r.reason, r.note].map(function (v) { return '"' + String(v || "").replace(/"/g, '""') + '"'; }).join(",");
  }).join("\n");
  dl("solicitudes.csv", "\ufeff" + h + b, "text/csv");
};
$("bk").onclick = function () { dl("respaldo-solicitudes.json", JSON.stringify(db), "application/json"); };
$("rs").onclick = function () { $("file").click(); };
$("file").onchange = function () {
  var f = this.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function () {
    try { var d = JSON.parse(r.result); if (d.reqs) { db = d; save(); load(); render(); liveCheck(); } } catch (e) { alert("Archivo no válido"); }
  };
  r.readAsText(f);
};
load(); render();
</script>
</body>
</html>
